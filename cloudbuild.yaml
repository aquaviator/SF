steps:
  # 1) Build the Docker image from apps/shiftflo
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - -f
      - apps/shiftflo/Dockerfile
      - apps/shiftflo

  # 2) Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID

  # 3) Deploy to Cloud Run, injecting secrets at runtime
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --update-secrets \
            DATABASE_URL=DATABASE_URL:latest,DB_PASSWORD=DB_PASSWORD:latest

substitutions:
  _SERVICE: "sf-test"
  _REGION:  "europe-west1"

options:
  logsBucket: "gs://shiftflow-build-logs"
