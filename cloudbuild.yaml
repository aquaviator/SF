steps:
  # 1) Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - -f
      - apps/shiftflo/Dockerfile
      - apps/shiftflo

  # 2) Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID

  # 3) Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --update-secrets DATABASE_URL=DATABASE_URL:latest,DB_PASSWORD=DB_PASSWORD:latest

substitutions:
  _SERVICE: "sf-test"
  _REGION: "europe-west1"

logsBucket: "gs://shiftflow-build-logs" # <--- THIS IS THE CORRECT PLACEMENT
